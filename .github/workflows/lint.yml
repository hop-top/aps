name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: "git config --global core.autocrlf input"
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned in lockstep with mise.toml so local + CI agree
          # on enabled linters and formatter rules.
          version: v2.12.2
          args: --timeout=5m ./...
          only-new-issues: true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Provides uvx, which `make docs-check` uses to run a pinned
      # cog without a checked-in Python toolchain.
      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      # Installs the lychee version pinned in mise.toml — the single
      # source of truth for the link-checker version. install_args
      # limits the install to lychee (no Go/goreleaser toolchain).
      - name: Set up lychee
        uses: jdx/mise-action@v4.3.0
        with:
          install_args: lychee

      - name: Check generated doc regions
        run: make docs-check

      - name: Check documentation links
        run: make lint-docs
