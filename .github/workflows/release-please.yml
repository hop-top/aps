name: release-please

# next carries prereleases, main cuts stable from a promoted rc
# (target versioning: hop-top/.github references/how-to/target-versioning.md).
on:
  push:
    branches: [main, next]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-please:
    uses: hop-top/.github/.github/workflows/release-please-on-push.yml@v0
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
    with:
      versioning-extension: true
