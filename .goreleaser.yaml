version: 2
project_name: aps

# Tags are shaped `aps/v<version>` (release-please monorepo
# convention with include-component-in-tag + tag-separator: "/").
# The reusable hop-top/.github/.github/workflows/goreleaser-on-tag.yml
# workflow synthesizes a local `v<bare>` git tag at the same commit
# and sets GORELEASER_CURRENT_TAG to it so {{.Version}} and {{.Tag}}
# resolve normally here. The reusable workflow also disables
# GoReleaser's own release publishing (release.disable: true below)
# and uploads dist/* to the release-please-created release afterwards
# via `gh release upload`. Reference:
# https://github.com/hop-top/.github/blob/main/docs/binaries/go.md

builds:
  - id: aps
    main: ./cmd/aps
    binary: aps
    env: [CGO_ENABLED=0]
    flags: [-trimpath, -buildvcs=false]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X hop.top/aps/internal/version.Version={{ .Version }}
      - -X hop.top/aps/internal/version.Commit={{ .Commit }}
      - -X hop.top/aps/internal/version.Date={{ .Date }}
      - -X hop.top/aps/internal/version.BuiltBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: aps
    ids: [aps]
    name_template: "aps_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  # release-please already authors the changelog from Conventional
  # Commits; don't duplicate it in the GitHub Release body.
  disable: true

release:
  # The reusable goreleaser-on-tag.yml workflow uploads dist/* to
  # the real release-please-created release via `gh release upload`
  # after the build. GoReleaser OSS can't target a release with a
  # different tag name than the current git tag (release.tag: is
  # Pro-only), so we disable its own release publishing entirely.
  disable: true
