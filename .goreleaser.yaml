version: 2
project_name: aps

# Tags are shaped `aps/v<version>` (release-please monorepo
# convention with include-component-in-tag + tag-separator: "/").
# The reusable hop-top/.github/.github/workflows/goreleaser-on-tag.yml
# workflow synthesizes a local `v<bare>` git tag at the same commit
# and sets GORELEASER_CURRENT_TAG to it so {{.Version}} and {{.Tag}}
# resolve normally here. The reusable workflow also disables
# GoReleaser's own release publishing (release.disable: true below)
# and uploads dist/* to the release-please-created release afterwards
# via `gh release upload`. Reference:
# https://github.com/hop-top/.github/blob/main/docs/binaries/go.md

builds:
  - id: aps
    main: ./cmd/aps
    binary: aps
    env: [CGO_ENABLED=0]
    flags: [-trimpath, -buildvcs=false]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X hop.top/aps/internal/version.Version={{ .Version }}
      - -X hop.top/aps/internal/version.Commit={{ .Commit }}
      - -X hop.top/aps/internal/version.Date={{ .Date }}
      - -X hop.top/aps/internal/version.BuiltBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Vault-enabled variant. The openbao secrets backend is opt-in at build
  # time (it pulls the Vault API client and ~17 transitive modules), so the
  # stock `aps` binary above omits it. Shipped as a separate artifact rather
  # than folded into `aps` so the default download stays lean.
  - id: aps-vault
    main: ./cmd/aps
    binary: aps
    env: [CGO_ENABLED=0]
    flags: [-trimpath, -buildvcs=false, -tags=openbao]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X hop.top/aps/internal/version.Version={{ .Version }}
      - -X hop.top/aps/internal/version.Commit={{ .Commit }}
      - -X hop.top/aps/internal/version.Date={{ .Date }}
      - -X hop.top/aps/internal/version.BuiltBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: aps
    ids: [aps]
    name_template: "aps_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

  # Same binary name inside the archive; the archive name carries the
  # variant so both can coexist on one release.
  - id: aps-vault
    ids: [aps-vault]
    name_template: "aps-vault_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  # release-please already authors the changelog from Conventional
  # Commits; don't duplicate it in the GitHub Release body.
  disable: true

release:
  # The reusable goreleaser-on-tag.yml workflow uploads dist/* to
  # the real release-please-created release via `gh release upload`
  # after the build. GoReleaser OSS can't target a release with a
  # different tag name than the current git tag (release.tag: is
  # Pro-only), so we disable its own release publishing entirely.
  disable: true

brews:
  - name: aps
    # Pin to the stock archive: with two archives defined, an unpinned
    # formula would pick up the vault variant as well.
    ids: [aps]
    repository:
      owner: hop-top
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/hop-top/aps
    description: "Agent Profile System"
    license: MIT
    # {{ .Env.RELEASE_TAG }} is the literal `aps/v<version>` tag,
    # which is the path segment GitHub Releases use for asset
    # downloads. {{.Tag}} here would resolve to the synthesized
    # bare tag — wrong for the URL.
    url_template: "https://github.com/hop-top/aps/releases/download/{{ .Env.RELEASE_TAG }}/{{ .ArtifactName }}"
    install: |
      bin.install "aps"
    test: |
      system "#{bin}/aps", "--version"

scoops:
  - name: aps
    # Pin to the stock archive; see the brews note above.
    ids: [aps]
    repository:
      owner: hop-top
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: https://github.com/hop-top/aps
    description: "Agent Profile System"
    license: MIT
    # Same RELEASE_TAG reasoning as brews above: the literal
    # `aps/v<version>` tag is the path segment GitHub Releases use
    # for asset downloads.
    url_template: "https://github.com/hop-top/aps/releases/download/{{ .Env.RELEASE_TAG }}/{{ .ArtifactName }}"
