# yaml-language-server: $schema=https://raw.githubusercontent.com/hop-top/kit/main/contracts/story-schema.json
schema_version: "1"
story_id: aps.conformance.delete-confirm-gate
title: Delete a profile through the typed-confirmation gate
binary: aps
intent: |
  Deleting a profile removes its directory irreversibly, and an
  unattended run has no TTY to show a y/n prompt on. aps gates the
  deletion behind a confirmation token derived from the command path,
  so an agent that was not told to delete this exact profile cannot
  produce it. The refusal is a true no-op — the profile is still there
  afterwards — and it names the token, so an operator who did intend
  the deletion proceeds in one step without any interactive step.
steps:
  - id: create_target
    intent: |
      Create the profile the rest of the story deletes.
    invoke: ["aps", "profile", "create", "doomed"]
    capture: [exit_code, stdout, stderr]
  - id: delete_refused
    intent: |
      Attempt the deletion with no confirmation token and read the
      refusal naming the required token.
    invoke: ["aps", "profile", "delete", "doomed"]
    capture: [exit_code, stdout, stderr]
  - id: target_survived
    intent: |
      List profiles and see the refused deletion changed nothing.
    invoke: ["aps", "profile", "list", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: delete_confirmed
    intent: |
      Re-issue with the token the refusal named.
    invoke: ["aps", "profile", "delete", "doomed", "--confirm-token=90af62d5c895"]
    capture: [exit_code, stdout, stderr]
  - id: target_gone
    intent: |
      List profiles and see the confirmed deletion applied.
    invoke: ["aps", "profile", "list", "--format", "json"]
    capture: [exit_code, stdout, stderr]
