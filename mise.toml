# mise configuration for oss-aps-cli
# Install tools: mise install
# Docs: https://mise.jdx.dev

[tools]
go = "1.26.6"
goreleaser = "latest"
# Pin minor version so local + CI agree on enabled linters and
# formatter rules. Bump in lockstep with .github/workflows/lint.yml.
golangci-lint = "2.12.2"
act = "latest"
# Pinned exactly: this is the single source of truth for the lychee
# version — CI installs it from here via jdx/mise-action (lint.yml).
lychee = "0.24.2"

[env]
CGO_ENABLED = "0"
